version: 2

sources:
  - name: wait_times
    description: "Parsed data tables for deng accelerator in databricks."
    database: deng_accelerator
    schema: raw_data

    config:
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 72
          period: hour
        loaded_at_field: "cast(fetched_at_utc as timestamp)"

    tables:
      - name: catalog_cache
      - name: parks
      - name: poll_attempts
      - name: snapshots
      - name: wait_observations